<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tichess</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><img id="brandImg" src="pieces/set1/wK.svg" alt=""><span>Tichess</span></div>
</header>

<div class="opts">
  <label>المحرك <select id="engineSel"></select></label>
  <label>القطع <select id="pieceSel"></select></label>
  <button id="sndBtn" class="snd" title="الصوت">🔊</button>
</div>

<nav class="tabs">
  <button data-tab="play" class="on">♟ العب ضد المحرك</button>
  <button data-tab="analyze">🔍 تحليل مباراة</button>
  <button data-tab="puzzles">🧩 الألغاز</button>
  <button data-tab="arena">⚔️ محركان ضد بعض</button>
</nav>

<div id="banner" hidden></div>

<main>
  <!-- ================= اللعب ================= -->
  <section id="tab-play">
    <div class="bots" id="pBots"></div>
    <div class="status" id="pStatus">جاري تشغيل المحرك…</div>
    <div class="boardrow"><div class="board-wrap"><div id="pBoard" class="board"></div><svg class="arrows" id="pArrows" viewBox="0 0 8 8"></svg></div></div>
    <div class="moves-strip" id="pMoves"></div>
    <div class="btns">
      <button id="pNew" class="primary">لعبة جديدة</button>
      <button id="pUndo">↩ تراجع</button>
      <button id="pFlip">⇅ قلب</button>
      <button id="pResign">🏳 استسلام</button>
    </div>
    <div class="btns">
      <button id="pAnalyze">🔍 حلّل هذه المباراة</button>
      <button id="pCopy">📋 نسخ PGN</button>
    </div>
    <div class="settings">
      <label>ألعب بـ
        <select id="pSide"><option value="w">الأبيض</option><option value="b">الأسود</option><option value="r">عشوائي</option></select>
      </label>
      <label id="pTimeBox" hidden>وقت التفكير
        <select id="pTime">
          <option value="300">سريع (0.3 ث)</option>
          <option value="1000" selected>عادي (1 ث)</option>
          <option value="3000">عميق (3 ث)</option>
          <option value="8000">أقوى (8 ث)</option>
        </select>
      </label>
    </div>
  </section>

  <!-- ================= الألغاز ================= -->
  <section id="tab-puzzles" hidden>
    <div class="panelTitle">🧩 20 لغزاً تكتيكياً</div>
    <div class="puzzleLevels" id="puzzleLevels"></div>
    <div class="puzzleCard"><div id="puzzleMeta"></div><div class="boardrow"><div class="board-wrap"><div id="zBoard" class="board"></div><svg class="arrows" id="zArrows" viewBox="0 0 8 8"></svg></div></div>
    <div id="puzzleHint" class="infocard">اختر نقلة الحل على الرقعة.</div>
    <div class="btns"><button id="zHint">💡 تلميح</button><button id="zCheck" class="primary">تحقق من النقلة</button><button id="zNext">اللغز التالي</button></div></div>
  </section>

  <!-- ================= مباراة المحركات ================= -->
  <section id="tab-arena" hidden>
    <div class="panelTitle">⚔️ محركان يلعبان ضد بعض</div>
    <div class="settings arenaSettings">
      <label>الأبيض <select id="arenaWhite"></select></label>
      <label>الأسود <select id="arenaBlack"></select></label>
      <label>وقت النقلة <select id="arenaTime"><option value="250">0.25 ثانية</option><option value="700" selected>0.7 ثانية</option><option value="1500">1.5 ثانية</option><option value="3000">3 ثوانٍ</option></select></label>
    </div>
    <div class="status" id="arenaStatus">اختر المحركين ثم ابدأ المباراة.</div>
    <div class="boardrow"><div class="board-wrap"><div id="arenaBoard" class="board"></div><svg class="arrows" id="arenaArrows" viewBox="0 0 8 8"></svg></div></div>
    <div class="moves-strip" id="arenaMoves">ستظهر النقلات هنا</div>
    <div class="btns"><button id="arenaStart" class="primary">▶ ابدأ</button><button id="arenaStop">إيقاف</button><button id="arenaReset">إعادة</button></div>
    <div class="subnote">تعمل المحركات بالتناوب على الجهاز؛ يتم تشغيل محرك واحد في كل نقلة لتقليل استهلاك الذاكرة.</div>
  </section>

  <!-- ================= التحليل ================= -->
  <section id="tab-analyze" hidden>
    <div id="aInput">
      <textarea id="aText" rows="5" placeholder="ألصق هنا مباراة بصيغة PGN (من Lichess أو غيره) أو قائمة نقلات مثل: 1. e4 e5 2. Nf3 Nc6"></textarea>
      <div class="btns">
        <button id="aGo" class="primary">▶ حلّل</button>
        <button id="aClear">مسح</button>
        <label class="inl">لكل نقلة
          <select id="aTime">
            <option value="150">سريع (0.15 ث)</option>
            <option value="400" selected>متوسط (0.4 ث)</option>
            <option value="1000">عميق (1 ث)</option>
          </select>
        </label>
      </div>
    </div>

    <div id="aProgress" hidden>
      <div class="pbar"><div id="aPbar"></div></div>
      <div class="ptext"><span id="aPtext"></span> <button id="aCancel">إلغاء</button></div>
    </div>

    <div id="aResult" hidden>
      <div class="boardrow">
        <div class="evalbar" id="aEvalBar"><div id="aEvalW"></div><span id="aEvalTxt">0.00</span></div>
        <div class="board-wrap"><div id="aBoard" class="board"></div><svg class="arrows" id="aArrows" viewBox="0 0 8 8"></svg></div>
      </div>
      <div class="navbtns">
        <button id="aFirst">⏮</button><button id="aPrev">◀</button><button id="aNext">▶</button><button id="aLast">⏭</button><button id="aFlip">⇅</button>
      </div>
      <div class="infocard" id="aInfo"></div>
      <div class="movelist" id="aMoves"></div>
      <table class="summary" id="aSummary"></table>
      <div class="btns"><button id="aNewAnalysis">تحليل مباراة أخرى</button></div>
    </div>
  </section>
</main>

<div id="review" class="modal" hidden><div class="box">
  <div id="reviewTxt" style="font-weight:700;font-size:17px;margin-bottom:8px"></div>
  <div>هل تريد مراجعة المباراة؟</div>
  <div class="btns"><button id="reviewYes" class="primary">نعم، راجعها 🔍</button><button id="reviewNo">لا</button></div>
</div></div>

<div id="promo" class="modal" hidden><div class="box"><div>اختر القطعة</div><div id="promoBtns"></div></div></div>

<script src="rules.js"></script>
<script src="engine.js"></script>
<script src="analysis.js"></script>
<script src="bots.js"></script>
<script src="puzzles.js"></script>
<script src="sound.js"></script>
<script src="app.js"></script>
</body>
</html>
